# Render 部署定义：免费 Web Service + 免费 Postgres
# 部署命令（拿到 API Key 后）：render deploy --yaml render.yaml
databases:
  - name: maikeda-db
    databaseName: maikeda
    user: maikeda
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: maikeda-ledger
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/state
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: maikeda-db
          property: connectionString
      - key: NODE_ENV
        value: production
